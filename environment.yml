  - matplotlib>=3.5.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0
  - pandas>=1.3.0
  - h5py>=3.0.0
  - pillow>=8.0.0
  - rdkit>=2022.3.0
  - mdtraj>=1.9.0
