  - qiskit>=0.39.0,<1.0.0
  - qiskit-machine-learning>=0.5.0,<1.0.0
  - tensorflow>=2.8.0,<2.16.0
  - tqdm>=4.65.0
  - pip
  - pip:
    - tensorflow>=2.8.0,<2.16.0
